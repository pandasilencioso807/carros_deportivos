<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Carros Deportivos</title>

    <style>
        body {
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: #1d3557;
        }

        table {
            width: 90%;
            height: 600px;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        td {
            border: 1px solid #ccc;
        }

        .izquierda {
            width: 25%;
            text-align: center;
            vertical-align: top;
            padding: 10px;
            background-color: #f5f5f5;
        }

        .miniatura {
            width: 120px;
            height: 90px;
            object-fit: contain;
            margin: 5px;
            border: 3px solid transparent;
            cursor: pointer;
        }

        .miniatura:hover {
            border: 3px solid #3498db;
        }

        .derecha {
            width: 75%;
            text-align: center;
            vertical-align: middle;
        }

        .visor {
            width: 500px;
            height: 400px;
            margin: auto;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #imagenGrande {
            width: 400px;
            height: 400px;
            object-fit: contain;
            transition: transform 0.3s;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #217dbb;
        }
    </style>

    <script>
        var zoom = 1;

        function cambiarImagen(imagen) {
            document.getElementById("imagenGrande").src = imagen;
            zoom = 1;

            document.getElementById("imagenGrande").style.transform =
                "scale(1)";
        }

        function aumentarZoom() {
            zoom = zoom + 0.2;

            if (zoom > 3) {
                zoom = 3;
            }

            document.getElementById("imagenGrande").style.transform =
                "scale(" + zoom + ")";
        }

        function disminuirZoom() {
            zoom = zoom - 0.2;

            if (zoom < 0.5) {
                zoom = 0.5;
            }

            document.getElementById("imagenGrande").style.transform =
                "scale(" + zoom + ")";
        }

        function restaurarZoom() {
            zoom = 1;

            document.getElementById("imagenGrande").style.transform =
                "scale(1)";
        }
    </script>

</head>

<body>

    <h1>Carros Deportivos</h1>

    <table>
        <tr>

            <td class="izquierda">

                <h3>Imágenes</h3>

                <img src="imagenes/C0001.jpg"
                     class="miniatura"
                     onclick="cambiarImagen('imagenes/C0001.jpg')">

                <br>

                <img src="imagenes/C0002.jpg"
                     class="miniatura"
                     onclick="cambiarImagen('imagenes/C0002.jpg')">

                <br>

                <img src="imagenes/C0003.jpg"
                     class="miniatura"
                     onclick="cambiarImagen('imagenes/C0003.jpg')">

                <br>

                <img src="imagenes/C0004.jpg"
                     class="miniatura"
                     onclick="cambiarImagen('imagenes/C0004.jpg')">

                <br>

                <img src="imagenes/C0005.jpg"
                     class="miniatura"
                     onclick="cambiarImagen('imagenes/C0005.jpg')">

            </td>

            <td class="derecha">

                <h2>Imagen seleccionada</h2>

                <div class="visor">

                    <img id="imagenGrande"
                         src="imagenes/C0001.jpg">

                </div>

                <br>

                <button onclick="disminuirZoom()">−</button>

                <button onclick="restaurarZoom()">Restablecer</button>

                <button onclick="aumentarZoom()">+</button>

            </td>

        </tr>
    </table>

</body>

</html>
